    origin: us-ms
    windows:
      - from: aug-1
        to: nov-2
        rating: prime
    specificity: month
    directness: availability
    paraphrase: Mississippi harvest chart lists pears in season Aug to Nov.
  - source: psu-harvest-calendar
    origin: us-pa
    windows:
      - from: aug-1
        to: oct-2
        rating: prime
    specificity: half-month
    directness: availability
    paraphrase: Pennsylvania harvest chart lists pears in season Aug to Oct.
  # Anjou (green), sold all year: four sources, all availability.
  - source: usapears-green-anjou
    origin: us-wa
    variety: anjou
    windows:
      - { from: sep-2, to: aug-2, rating: prime }
    specificity: season
    directness: availability
    paraphrase: Northwest green Anjou reaches stores by late September and stays through the summer.
  - source: markon-pears-update-5
    origin: us-wa
    variety: anjou
    windows:
      - { from: sep-1, to: jul-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: Washington D'Anjou production starts in early September and runs through July.
  - source: superfresh-anjou-year-round
    origin: us-wa
    variety: anjou
    windows:
      - { from: sep-2, to: aug-2, rating: prime }
    specificity: season
    directness: availability
    paraphrase: Green Anjou arrives in late September or early October and is the most common pear all summer.
  - source: specialtyproduce-anjou
    origin: us
    variety: anjou
    windows:
      - { from: nov-1, to: feb-2, rating: prime }
    specificity: season
    directness: availability
    paraphrase: Anjou is sold all year; its peak season runs from late fall through winter.
  - source: usapears-red-anjou
    origin: us-wa
    variety: red-anjou
    windows:
      - { from: sep-2, to: aug-2, rating: prime }
    specificity: season
    directness: availability
    paraphrase: Northwest Red Anjou is in markets from late September or early October through the summer.
  # Bartlett: Washington in fall, California in summer, Argentine imports in spring.
