item: apricots
status: draft
claims:
  # California: late May to July, the main varieties in June.
  - source: askthefoodgeek-apricots
    origin: us-ca
    windows:
      - { from: may-1, to: jul-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Most apricots come from California, where southern growers pick from May to July.
  - source: eatlikenoone-apricot-season
    origin: us-ca
    windows:
      - { from: apr-2, to: jul-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: California apricots reach stores in late April to early May, and the crop wraps up in late July.
  - source: wholefoods-peak-pick-apricots
    origin: us-ca
    windows:
      - { from: may-2, to: jun-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: Early California varieties carry stores to the end of May, followed by the peak production varieties of June.
  - source: foodnetwork-apricots-in-season
    origin: us-ca
    windows:
      - { from: may-1, to: jul-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Apricots are in season from early May to July.
  - source: grocerycoop-apricots
    origin: us-ca
    windows:
      - { from: jun-2, to: jul-1, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: California apricots are available from mid-June through mid-July.
  - source: veritable-sweet-season-apricots
    origin: us-ca
    windows:
      - { from: may-2, to: jul-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: On the West Coast, apricot season runs from late May to July.
  - source: californiabountiful-elevating-apricots
    origin: us-ca
    windows:
      - { from: may-2, to: jul-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: The fresh season lasts about six weeks, mostly late June to July, with harvest as early as late May.
  # Washington: late June to mid-August, peaking in early July.
  - source: eatlikenoone-apricot-season
    origin: us-wa
    windows:
      - { from: jun-1, to: aug-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: The Washington apricot season runs from June to August, and August belongs almost only to Washington.
  - source: grocerycoop-apricots
    origin: us-wa
    windows:
      - { from: jul-2, to: aug-1, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: Washington apricots are available from mid-July through mid-August.
  - source: freshplaza-washington-apricots-later
    origin: us-wa
    windows:
      - { from: jul-1, to: aug-1, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: In a late year, a grower expected its Washington harvest from early July through mid-August.
  - source: freshplaza-washington-apricot-season-begins
    origin: us-wa
    windows:
      - { from: jul-1, to: jul-1, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: The brief Washington season was expected to peak through the first part of July.
  - source: nwpb-northwest-apricots-2022
    origin: us-wa
    windows:
      - { from: jul-1, to: jul-1, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: The Washington season's peak was expected around the end of the first week of July.
