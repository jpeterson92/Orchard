item: pomegranates
status: draft
claims:
  # California: Wonderful from mid-October through December.
  - source: freshplaza-ca-pomegranates-demand
    origin: us-ca
    windows:
      - { from: oct-2, to: dec-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: California's main Wonderful harvest starts around October 15, with whole fruit shipped until December 31.
  - source: pom-season-returns-2015
    origin: us-ca
    windows:
      - { from: oct-1, to: jan-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Fresh pomegranate season begins in October; POM Wonderful's fresh fruit is sold October through January.
  - source: foodwise-fall-fruit
    origin: us-ca
    windows:
      - { from: sep-2, to: nov-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: At California markets, pomegranates start in late September and pick up through October and November.
  - source: askthefoodgeek-pomegranates
    origin: us
    windows:
      - { from: sep-1, to: dec-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Pomegranates show up from September through December, sometimes January; packaged arils last into February.
  # Chile: a spring import.
  - source: freshplaza-ca-season-ends-chile
    origin: cl
    windows:
      - { from: feb-1, to: may-2, rating: prime }
    specificity: season
    directness: availability
    paraphrase: Chile's pomegranate season starts in February and runs into spring, when US demand is lower.
  - source: freshplaza-chile-pomegranates
    origin: cl
    windows:
      - { from: mar-2, to: jun-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: Chilean pomegranates began arriving in late March and keep coming until the beginning of July.
  - source: freshplaza-sa-pomegranates-strong-demand
    origin: cl
    windows:
      - { from: mar-1, to: jun-1, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Chile's early varieties arrive in the first week of March, then Wonderful; imports run until June.
  # Argentina: one importer since 2018, and a Córdoba grower.
  - source: freshplaza-sa-pomegranates-strong-demand
    origin: ar
    windows:
      - { from: apr-2, to: may-2, rating: fair }
    specificity: season
    directness: eating-quality
    paraphrase: An importer finds late-April Argentine fruit large and very sweet, about 17 to 18 Brix, with little membrane.
  # Harvest mid-February to mid-April; with the 15-day cold treatment in transit, US arrivals run about a month later.
  - source: freshplaza-argentina-pomegranates-positive-results
    origin: ar
    windows:
      - { from: mar-2, to: may-1, rating: prime }
    specificity: month
    directness: availability
    paraphrase: A Córdoba grower harvested from mid-February to mid-April and shipped fresh and processing fruit to the US.
  # Israel: Wonderful exports from late October through February, into March.
  - source: freshplaza-israeli-pomegranates-in-markets
    origin: il
    windows:
      - { from: oct-2, to: feb-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: Israel's Wonderful pomegranates run from the end of October through February, peaking in December.
  - source: perishablenews-israeli-pomegranates-march
    origin: il
    windows:
      - { from: jan-1, to: mar-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Israeli pomegranates follow the holidays, with availability extending into March.
  - source: freshplaza-jvi-israel-pomegranates
    origin: il
    windows:
      - { from: dec-2, to: mar-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: An importer's first Israeli containers arrive in mid-December; Israel's season runs to March.
  # Peru: harvest March to May, in US stores April into June.
  - source: freshplaza-peru-pomegranates-us-opportunities
    origin: pe
    windows:
      - { from: mar-1, to: may-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: Peru's pomegranate harvest runs March to May, filling the gap before California's October start.
  - source: freshplaza-peru-figs-pomegranates-spring
    origin: pe
    windows:
      - { from: apr-1, to: may-2, rating: prime }
    specificity: half-month
    directness: availability
    paraphrase: An importer's first Peruvian pomegranates arrive in mid-April, after Israel's season, and last through May.
  - source: freshplaza-jvi-israel-pomegranates
    origin: pe
    windows:
      - { from: apr-1, to: jun-2, rating: prime }
    specificity: month
    directness: availability
    paraphrase: After Israel's season ends in March, Peruvian supply follows and could last into June or July.
