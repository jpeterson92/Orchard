      - { from: sep-1, to: sep-1, rating: prime }
      - { from: sep-2, to: sep-2, rating: fair }
      - from: oct-1
        to: dec-2
        rating: poor
        reason: Sources split on Gala from storage (one says it keeps well, one that it turns soft); a marginal Gala rates down.
    quotedAs: [gala, royal-gala]
