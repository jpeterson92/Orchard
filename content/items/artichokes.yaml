evidenceBasis: assessment-only
cardLine: Heavy for its size, with tight leaves that squeak.
pick:
  - Heavy for its size
  - Tight, compact leaves that squeak when squeezed
  - Fresh-looking stem end, not dry or split
  - Bronze, blistered winter skin is frost and eats fine
avoid:
  - Loose, spreading or dry, brown leaves
  - A sour or fermented smell
store:
  temperature: cold
  ethylene: neither
  life: { min: 5, max: 7, unit: days }
  text: Trim a thin slice off the stem, sprinkle with water and refrigerate in a sealed bag. Typically best cooked within 5–7 days.
  sources: [umn-artichokes, instacart-artichoke-season]
prep: Rinse well, snip the leaf tips and trim the stem. Rub cut surfaces with lemon so they don't brown; scoop out the fuzzy choke before eating the heart.
