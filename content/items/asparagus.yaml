selections:
  - id: us-spring
    label: US-grown spring asparagus
    cue: From April to June, look for Michigan, Washington or California on the band, label or sign; most asparagus sold year-round comes from Mexico or Peru. Pick firm spears with tight tips and moist cut ends, and cook them within a day or two.
