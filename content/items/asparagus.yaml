peakWorthSeeking:
  value: true
  sources: [tastingtable-out-of-season-asparagus, metropolitan-market-asparagus]
  note: Sugars fade within days of cutting, so fresh spring spears taste sweeter and more tender.
storesWell:
  value: false
  sources: [usda-hb66-asparagus, osu-ohioline-asparagus]
  note: Keeps weeks at best in commercial cold storage, days at home.
evidenceBasis: supply+assessment
cardLine: Firm, straight spears with tight, closed tips.
pick:
  - Tips tight and closed, not spreading or seeding
  - Stalks firm and straight; they snap rather than bend
  - Cut ends moist, not dry, split or woody
  - Thick or thin both eat well; pick one size so they cook evenly
avoid:
  - Limp, wrinkled or slimy spears
  - Mushy or dark tips
store:
  temperature: cold
  ethylene: sensitive
  life: { min: 2, max: 4, unit: days }
  text: Trim the ends and stand the spears in an inch of water, or wrap the ends in a damp paper towel, loosely bagged in the fridge. Typically keeps 2–4 days; flavor fades sooner.
  sources: [osu-ohioline-asparagus, usda-hb66-asparagus]
prep: Rinse well, especially the tips, where grit hides. Snap or trim the woody ends; peel thick stalks if the skin is tough.
