id: blueberries
name: Blueberries
synonyms: [blueberry]
misspellings: [bluberries, blueberrys, blueberies, bluebery]
category: berries
purchaseRank: 8
alwaysGood: false
shipsWell:
  value: true
  sources: [ucdavis-postharvest-bushberry, freshplaza-us-blueberry-imports]
  note: Keeps one to two weeks cold; buyers call imported berries consistent in quality and flavor.
peakWorthSeeking:
  value: true
  sources: [ucdavis-postharvest-bushberry, pnwag-blueberry-season]
  note: Picked ripe and never sweeter afterward, so fruit picked in its main summer season tastes best.
storesWell:
  value: false
  sources: [osu-ohioline-berries, ucdavis-postharvest-bushberry]
  note: Highly perishable; keeps days at home and a couple of weeks commercially, not months.
evidenceBasis: supply+assessment
cardLine: Plump, firm and dusty blue with a silvery bloom.
pick:
  - Plump and firm, deep blue all over
  - A waxy, silvery bloom on the skin
  - Dry berries that roll freely in the pack
avoid:
  - Red or green berries; they won't ripen after picking
  - Stains, juice or mold in the pack
store:
  temperature: cold
  ethylene: neither
  life: { min: 3, max: 7, unit: days }
  text: Refrigerate unwashed in the original pack, kept dry. Typically keeps 3–7 days; pick out soft berries as you go.
  sources: [osu-ohioline-berries, driscolls-blueberries, ucdavis-postharvest-bushberry]
ripen:
  text: They won't sweeten after picking. Eat them chilled or at room temperature.
  sources: [ucdavis-postharvest-bushberry, driscolls-blueberries]
prep: Rinse gently in cool water just before eating, then drain. Never soak them.
