cardLine: Small, firm, tight heads with bright green leaves.
pick:
  - Firm, compact heads that feel heavy for their size
  - Bright green, tightly wrapped leaves
  - Smaller sprouts are usually sweeter and more tender
  - Clean, pale cut ends
avoid:
