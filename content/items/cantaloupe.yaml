  note: Keeps about two weeks even under ideal cold storage.
evidenceBasis: supply+assessment
cardLine: Heavy, with raised netting and a sweet smell.
pick:
  - Heavy for its size
  - Raised, coarse netting; a slight green cast is fine on newer varieties
  - A smooth, slightly sunken stem scar, with no stem left
  - A sweet, musky smell at the blossom end
avoid:
  - Soft spots, bruises or a sloshing center
store:
  temperature: cold
  ethylene: both
  life: { min: 4, max: 7, unit: days }
  text: Refrigerate a ripe melon and use it within about a week; keep it away from greens, since it gives off ethylene. Wrap cut melon and eat it within a few days.
  sources: [ucdavis-postharvest-cantaloupe]
ripen:
  text: A firm melon softens and gets more fragrant on the counter in a day or two, but it won't get sweeter.
  sources: [ucdavis-postharvest-cantaloupe, thetakeout-flavorless-cantaloupe]
prep: Scrub the rind under running water before cutting, since the netting can hold dirt and germs.
