id: collard-greens
name: Collard greens
synonyms: [collards, collard, collard green, collards greens]
misspellings: [colard greens, collard grens, colards, collord greens, collerd greens]
category: leafy-greens
purchaseRank: 55
alwaysGood: false
shipsWell:
  value: true
  sources: [usda-ams-fv-movement, californiagrown-leafy-greens]
  note: Southeastern and California bunches ship by truck nationwide.
peakWorthSeeking:
  value: true
  sources: [gardenandgun-greens-frost, colostate-planttalk-frost-sweet]
  note: Cold-weather leaves are sweeter and more tender.
storesWell:
  value: false
  sources: [umn-collard-greens]
  note: Best used within about five days of purchase.
evidenceBasis: assessment-only
cardLine: Deep green, firm leaves with no yellowing; smaller leaves are more tender.
pick:
  - Dark green leaves with no yellow
  - Firm, crisp leaves, not limp
  - Smaller leaves for tender, milder greens
avoid:
  - Yellowing or browning leaves, or lots of small holes
store:
  temperature: cold
  ethylene: sensitive
  life: { min: 3, max: 5, unit: days }
  text: Refrigerate unwashed in a plastic bag. Typically best within 3–5 days.
  sources: [umn-collard-greens]
prep: Swish the leaves in a big bowl of water, lift them out and repeat until no grit remains. Strip out the thick midribs, especially in summer, then slice and cook.
origins:
  - origin: us-ga
    windows:
      - from: nov-1
        to: feb-2
        rating: prime
        reason: Frost-sweetened winter leaves are the ones Garden & Gun calls peak flavor, and Georgia ships its main crop then; the panel rates them prime.
      - { from: mar-1, to: apr-2, rating: fair }
      - from: may-1
        to: sep-2
        rating: poor
        reason: Georgia's chart lists May and June and Colorado State's fall starts in September, but Southeastern leaves grown in heat have the tough midribs Colorado State describes; first frost comes later here.
      - from: oct-1
        to: oct-2
        rating: fair
        reason: October leaves are good but come before the Southeast's first frost, so they stay fair until the cold sweetens them.
  - origin: us-sc
    windows:
      - from: nov-1
        to: feb-2
        rating: prime
        reason: Frost-sweetened winter leaves are the ones Garden & Gun calls peak flavor, and South Carolina ships most of its collards in November and December; the panel rates them prime.
      - { from: mar-1, to: apr-2, rating: fair }
      - from: may-1
        to: sep-2
        rating: poor
        reason: Colorado State's fall starts in September, but Southeastern leaves grown in heat have the tough midribs it describes; first frost comes later here.
      - from: oct-1
        to: oct-2
        rating: fair
        reason: October leaves are good but come before the Southeast's first frost, so they stay fair until the cold sweetens them.
  - origin: us-tx
    windows:
      - from: nov-1
        to: feb-2
        rating: prime
        reason: Colorado State says cool temperatures sweeten collards as frost does, and South Texas winters are cool; the panel rates them prime with the Southeast's.
      - { from: mar-1, to: mar-2, rating: fair }
      - from: apr-1
        to: oct-2
        rating: poor
        reason: Colorado State's fall starts in September, but South Texas is still hot then and leaves grown in heat are tough.
  - origin: us-ca
    windows:
      - from: nov-1
        to: feb-2
        rating: prime
        reason: Colorado State says cool temperatures sweeten collards as frost does; California's winter collards grow in the cool Imperial Valley, so the panel rates them prime with the Southeast's.
      - from: mar-1
        to: oct-2
        rating: fair
        reason: Colorado State's tough summer leaves come from hot summers; California's summer collards grow on the cool coast, so they stay fair with the panel.
