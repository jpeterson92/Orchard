alwaysGood: false
shipsWell:
  value: true
  sources: [ucdavis-postharvest-grape, ffp-peruvian-seedless-2018]
  note: Picked ripe and held near freezing; Southern Hemisphere fruit arrives sound, though quality varies.
peakWorthSeeking:
  value: true
  sources: [ucdavis-postharvest-grape, ffp-peruvian-seedless-2018]
  note: They never sweeten after picking, and late-season or long-stored fruit loosens and softens.
storesWell:
  value: false
  sources: [msstate-happyhealthy-grapes, ucdavis-postharvest-grape]
  note: Keeps one to two weeks at home; berries loosen from the stem the longer they're held.
evidenceBasis: supply+assessment
cardLine: Plump, firm grapes on green, flexible stems.
pick:
  - Firm, plump grapes still attached to the stem
  - Green, flexible stems, not brown or brittle
  - Full color for the variety
avoid:
  - Loose grapes in the bag, or shriveled or split ones
  - Soft, leaky or moldy grapes
store:
  temperature: cold
  ethylene: neither
  life: { min: 7, max: 14, unit: days }
  text: Refrigerate unwashed in the vented bag, in the produce drawer. Typically keeps 1–2 weeks.
  sources: [msstate-happyhealthy-grapes, ucdavis-postharvest-grape]
ripen:
  text: They won't ripen or sweeten after picking, so taste one if you can.
  sources: [msstate-happyhealthy-grapes, ucdavis-postharvest-grape]
prep: Rinse just before eating, then pull from the stem.
