evidenceBasis: assessment-only
cardLine: Heavy for its size, firm and glossy, no soft spots.
pick:
  - Heavy for its size
  - Firm, glossy skin with no soft spots
  - Skin fairly snug, not puffy or hollow-feeling
  - A fresh citrus smell at the stem
avoid:
  - Light, puffy fruit; it's often dry inside
  - Soft, sunken or moldy spots
store:
  temperature: cold
  ethylene: neither
  life: { min: 1, max: 2, unit: weeks }
  text: Keeps about a week on a cool counter, or 1–2 weeks loose in the fridge. Check every few days and remove any soft or moldy fruit.
  sources: [illinois-extension-winter-citrus, cuties-how-long-they-last]
prep: Rinse, then peel by hand from the stem end. The white pith is edible. Peeled segments keep up to a week, covered, in the fridge.
