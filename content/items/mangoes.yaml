id: mangoes
name: Mangoes
synonyms: [mango, mangos, ataulfo, honey mango, champagne mango, kent, keitt, tommy atkins, haden]
misspellings: [mangoe, mangos', mango's, manggo, mangoz, ataulfa, atulfo, kiet]
category: tropical
purchaseRank: 16
alwaysGood: false
shipsWell:
  value: true
  sources: [nmb-ripening-storing, ucdavis-postharvest-mango]
  note: Picked mature and ripens after harvest, so imports sweeten on the counter.
peakWorthSeeking:
  value: true
  sources: [foodnetwork-mangoes, theproducemoms-mangos]
  note: Sources name the late spring and summer season as clearly better eating.
storesWell:
  value: false
  sources: [ucdavis-postharvest-mango, nmb-ripening-storing]
  note: Keeps only weeks even in commercial storage, and cold damages its flavor.
evidenceBasis: supply+assessment
cardLine: Gives slightly when squeezed; judge by feel, not color.
pick:
  - Gives slightly when gently squeezed
  - Fruity smell at the stem end
  - Plump, full cheeks
  - Red blush doesn't mean ripe; color is no guide
  - Honey mangos wrinkle a little as they ripen
avoid:
  - Mushy spots, bruises or broken skin
store:
  temperature: cold
  ethylene: producer
  life: { min: 3, max: 5, unit: days }
  text: Don't refrigerate a mango until it's ripe; the cold dulls its flavor. Once ripe, keep it whole in the fridge for up to 5 days.
  sources: [nmb-ripening-storing, ucdavis-postharvest-mango]
ripen:
  text: Leave firm mangoes on the counter for a few days to sweeten and soften. A closed paper bag speeds it up.
  sources: [nmb-ripening-storing]
prep: Rinse, then slice the two cheeks off either side of the flat seed. Score the flesh in a grid and scoop it out.
