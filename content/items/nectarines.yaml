cardLine: Fragrant, brightly colored and giving slightly along the seam.
pick:
  - A sweet, fruity smell
  - Yellow or creamy background color, with no green
  - Gives slightly to gentle pressure
  - Smooth skin without bruises or wrinkles
avoid:
  - Green, rock-hard fruit; it was picked too early
  - Shriveled or soft, bruised fruit
store:
  temperature: cold
  ethylene: producer
  life: { min: 3, max: 5, unit: days }
  text: Once ripe, refrigerate and eat within a few days. Don't chill hard nectarines; cold before ripening can turn them mealy and flavorless.
  sources: [ucdavis-postharvest-peach, udel-stone-fruit-cold-storage]
ripen:
  text: Ripen firm nectarines at room temperature, out of the sun, for a day or two until they give slightly.
  sources: [ucdavis-postharvest-peach, udel-stone-fruit-cold-storage]
prep: Rinse just before eating. No need to peel; the skin is smooth.
