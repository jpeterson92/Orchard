  note: Long cold shipping risks mealy, flavorless fruit; winter imports are picked early for the trip.
peakWorthSeeking:
  value: true
  sources: [eatlikenoone-peach-season, scripps-summer-fruit-months]
  note: Peaches really have to be in season to taste good; summer fruit is far better.
storesWell:
  value: false
  sources: [ucdavis-postharvest-peach, udel-stone-fruit-cold-storage]
  note: Market life is weeks at most, and cold storage risks mealy, browned flesh.
evidenceBasis: supply+assessment
cardLine: Smells like a peach and gives slightly near the stem.
pick:
  - A sweet peach smell
  - Yellow or creamy background color, with no green
  - Gives slightly to gentle pressure
  - Smooth skin without bruises or wrinkles
avoid:
  - Green background color; picked too early, it won't ripen well
  - Bruised, soft or shriveled fruit
store:
  temperature: cold
  ethylene: producer
  life: { min: 3, max: 5, unit: days }
  text: Once ripe, refrigerate in a bag and eat within 3–5 days. Don't chill hard peaches; cold before ripening can turn them mealy.
  sources: [usu-store-peaches, osu-livesmart-peaches, ucdavis-postharvest-peach]
ripen:
  text: Ripen firm peaches at room temperature in a loosely closed paper bag, in a single layer. Check daily; it usually takes a day or two.
  sources: [osu-livesmart-peaches, usu-store-peaches]
prep: Rinse just before eating. Peel if you like by dipping in boiling water for 30 seconds, then ice water.
