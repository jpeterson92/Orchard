evidenceBasis: supply+assessment
cardLine: Heavy, fragrant and giving slightly at the tip.
pick:
  - Heavy for its size
  - Gives slightly at the end opposite the stem
  - Full, even color for its variety
  - A light dusty bloom on the skin is natural
avoid:
  - Rock-hard fruit; it may never ripen well
  - Shriveled skin or soft, leaking spots
store:
  temperature: cold
  ethylene: producer
  life: { min: 3, max: 5, unit: days }
  text: Once ripe, refrigerate and eat within a few days. Don't chill hard plums; cold before ripening can turn them mealy and bland.
  sources: [ucdavis-postharvest-plum, udel-stone-fruit-cold-storage]
ripen:
  text: Ripen firm plums at room temperature for a day or two until they give slightly.
  sources: [ucdavis-postharvest-plum, udel-stone-fruit-cold-storage]
prep: Rinse just before eating. The skin is edible; cut around the pit to slice.
