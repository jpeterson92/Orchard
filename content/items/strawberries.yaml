evidenceBasis: supply+assessment
cardLine: Deep red right up to a fresh green cap.
pick:
  - Bright red all the way to the cap
  - Glossy, plump and dry
  - Fresh green caps, not wilted or brown
  - A sweet strawberry smell
avoid:
  - White or green shoulders; they won't ripen after picking
  - Any mold or juice in the pack
store:
  temperature: cold
  ethylene: neither
  life: { min: 2, max: 3, unit: days }
  text: Refrigerate unwashed in the coldest part of the fridge, loosely covered or on a paper towel. Typically keeps 2–3 days; pull out any soft or moldy berries.
  sources:
    [illinois-extension-small-fruit-handling, cal-strawberry-commission-facts, ucdavis-postharvest-strawberry]
ripen:
  text: They won't ripen or sweeten after picking. For fuller flavor, let them sit at room temperature for up to an hour before eating.
  sources: [ufifas-gardening-strawberries, cal-strawberry-commission-facts]
prep: Rinse under cool water just before eating, then hull. Washing ahead speeds mold.
