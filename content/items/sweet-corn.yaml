  note: Today's supersweet types hold their sugar for days when kept cold, so shipped corn stays sweet.
peakWorthSeeking:
  value: true
  sources: [usu-sweet-corn, californiagrown-five-crowns]
  note: Fresh-picked summer corn tastes clearly sweeter, and sources name best months.
storesWell:
  value: false
  sources: [csu-sweet-corn, usu-sweet-corn]
  note: Sugar turns to starch after picking; it keeps days, not weeks.
evidenceBasis: supply+assessment
cardLine: Snug green husks, moist silk and plump kernels to the tip.
pick:
  - Bright green husks wrapped snugly around the ear
  - Pale, moist silk; brown tips are fine
  - Plump kernels you can feel to the tip through the husk
  - Heavy, with a fresh, pale stem end
avoid:
  - Dry, yellowing husks or a browned stem end
  - Dented or shriveled kernels
store:
  temperature: cold
  ethylene: neither
  life: { min: 1, max: 3, unit: days }
  text: Refrigerate in the husk right away, loosely wrapped, and typically use within 1–3 days. It loses sweetness as it sits, slower in supersweet types.
  sources: [csu-sweet-corn, usu-sweet-corn]
ripen:
  text: Corn doesn't ripen or sweeten after picking; it only loses sugar, so cook it soon.
  sources: [csu-sweet-corn, uga-shipper-sweet-corn]
prep: Husk and pull off the silk just before cooking. Boil 3–5 minutes, or grill in or out of the husk.
