shipsWell:
  value: true
  sources: [ucdavis-postharvest-watermelon, producebusiness-winter-melon-guide]
  note: Picked fully ripe since it won't sweeten later; winter melons ship north from Mexico and Guatemala.
peakWorthSeeking:
  value: true
  sources: [thetakeout-watermelon-season, producebusiness-winter-melon-guide]
  note: Summer melons are sweetest; winter imports have had sugar problems and rarely match them.
storesWell:
  value: false
  sources: [ucdavis-postharvest-watermelon]
  note: Keeps about two weeks whole and is chill-sensitive, so it isn't stored between seasons.
evidenceBasis: supply+assessment
cardLine: Heavy, with a creamy yellow ground spot.
pick:
  - Heavy for its size
  - A creamy yellow ground spot, not white
  - Firm and symmetrical, with no dents or flat sides
avoid:
  - Bruises, cracks or soft spots
store:
  temperature: cool
  ethylene: sensitive
  life: { min: 1, max: 2, unit: weeks }
  text: Keep whole melons cool and away from bananas and apples; the fridge for long spells can dull the flavor. Refrigerate cut melon, covered, and eat it within a few days.
  sources: [ucdavis-postharvest-watermelon, thetakeout-watermelon-season]
ripen:
  text: It won't ripen or sweeten after picking, so choose a ripe one in the store.
  sources: [ucdavis-postharvest-watermelon]
prep: Rinse the rind before cutting so the knife doesn't carry dirt into the flesh.
