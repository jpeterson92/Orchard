shipsWell:
  value: true
  sources: [usda-ams-fv-movement, freshplaza-mexico-hard-squash-season]
  note: The hard rind travels well; Mexico ships across the US all winter.
peakWorthSeeking:
  value: true
  sources: [umass-winter-squash-curing, oregonstate-butternut-bland]
  note: Fall squash given a few weeks to sweeten in storage eats best.
storesWell:
  value: true
  sources: [umass-winter-squash-curing, cooksmarts-winter-squash, foodprint-winter-squash]
  note: Cured fall squash keeps for months; butternut keeps longest.
evidenceBasis: assessment-only
cardLine: Heavy for its size, with a dull, hard rind and dry stem.
pick:
  - Heavy for its size
  - Dull, hard rind; a soft rind can mean watery, bland flesh
  - Firm, dry stem still attached
  - Butternut fully tan, with no green streaks
avoid:
  - Soft spots, cuts or blemishes
store:
  temperature: cool
  ethylene: neither
  life: { min: 1, max: 3, unit: months }
  text: Keep whole squash in a cool, dark, dry spot rather than the fridge; typically good for 1–3 months, butternut longest. Refrigerate cut squash, covered, for up to 5 days.
  sources: [umn-winter-squash, foodprint-winter-squash, umass-winter-squash-curing]
prep: Halve with a heavy knife, scoop out the seeds and roast cut side down. Peel butternut with a sturdy peeler; delicata skin is tender enough to eat.
