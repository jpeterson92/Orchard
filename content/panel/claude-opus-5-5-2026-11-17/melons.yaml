          - [jun-1, aug-1, prime, high]
      - origin: us-tx
        windows:
          - [jun-1, aug-1, prime, medium]
      - origin: us-ca
        windows:
          - [jul-1, sep-1, prime, medium]
      - origin: us-in
        windows:
