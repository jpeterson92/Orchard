category: tomatoes-peppers
items:
  - item: tomatoes
    traits:
      {
        shipsWell: [false, high],
        storesWell: [false, high],
        peakWorthSeeking: [true, high],
        alwaysGood: [false, high],
      }
    origins:
      - origin: mx
        windows:
          - [jan-1, dec-2, fair, medium]
        note: Much is greenhouse or shade-house vine-ripe fruit, the steadiest choice in winter.
      - origin: us-fl
        windows:
          - [oct-2, jun-1, poor, medium]
        note: Field rounds picked mature-green and ripened with ethylene; firm and usually bland.
      - origin: ca
        windows:
          - [mar-1, nov-2, fair, medium]
      - origin: us-ca
        windows:
          - [jul-1, oct-2, fair, low]
      - origin: us-tn
        windows:
          - [jun-2, aug-2, prime, medium]
      - origin: us-nj
        windows:
          - [jul-2, sep-1, prime, medium]
    note: Locally grown summer tomatoes are far better; in winter, cherry, grape and vine-ripe greenhouse beat field rounds.

  - item: bell-peppers
    traits:
      {
        shipsWell: [true, medium],
        storesWell: [false, high],
        peakWorthSeeking: [false, medium],
        alwaysGood: [true, medium],
      }
