      - origin: us-fl
        windows:
          - [nov-1, jun-1, fair, medium]
      - origin: ca
        windows:
          - [mar-1, nov-1, fair, medium]
    note: Field and greenhouse supply rotates year-round with steady quality; choose firm, glossy, heavy peppers.

  - item: mini-sweet-peppers
