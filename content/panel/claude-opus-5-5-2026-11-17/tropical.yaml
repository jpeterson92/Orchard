  - item: plantains
    traits:
      {
        shipsWell: [true, high],
        storesWell: [false, high],
        peakWorthSeeking: [false, high],
        alwaysGood: [true, high],
      }
    origins:
      - origin: gt
        windows:
          - [jan-1, dec-2, fair, high]
      - origin: ec
        windows:
          - [jan-1, dec-2, fair, high]
      - origin: co
        windows:
          - [jan-1, dec-2, fair, medium]
    note: Year-round imports; ripeness stage matters far more than the month.

  - item: avocados
    traits:
      {
        shipsWell: [true, high],
        storesWell: [false, medium],
        peakWorthSeeking: [true, medium],
        alwaysGood: [false, medium],
      }
    origins:
      - origin: mx
        windows:
          - [nov-1, may-2, prime, high]
          - [jun-1, oct-2, fair, medium]
        note: Main-crop Michoacán fruit is richest; early-season fruit in late summer can be watery.
      - origin: us-ca
        windows:
          - [mar-1, mar-2, fair, medium]
          - [apr-1, aug-2, prime, high]
          - [sep-1, sep-2, fair, medium]
      - origin: pe
        windows:
          - [may-1, sep-1, fair, medium]
      - origin: us-fl
        windows:
          - [jun-2, jan-1, fair, medium]
    varieties:
      - variety: hass
        windows:
          - [nov-1, aug-2, prime, medium]
          - [sep-1, oct-2, fair, medium]
        note: Oil content, and so richness, dips with the early-season fruit of late summer and fall.
      - variety: green-skin
        windows:
          - [jul-1, dec-2, fair, medium]
        note: Florida types such as Choquette; larger, milder and more watery than Hass.
    note: Hass is good most of the year; early-season fruit around September and October is less buttery.

  - item: mangoes
    traits:
      {
        shipsWell: [true, medium],
        storesWell: [false, high],
        peakWorthSeeking: [true, high],
        alwaysGood: [false, high],
      }
    origins:
      - origin: mx
        windows:
          - [mar-1, aug-2, prime, medium]
          - [sep-1, sep-2, fair, medium]
      - origin: pe
        windows:
          - [jan-1, mar-2, fair, medium]
      - origin: ec
        windows:
          - [oct-2, jan-1, fair, medium]
      - origin: br
        windows:
          - [sep-1, nov-2, fair, low]
      - origin: gt
        windows:
          - [feb-1, may-1, fair, low]
    varieties:
      - variety: ataulfo
        windows:
          - [feb-1, feb-2, fair, medium]
          - [mar-1, jun-2, prime, high]
          - [jul-1, aug-1, fair, medium]
        note: Also sold as honey mango; buttery and fiberless when wrinkled-ripe.
      - variety: tommy-atkins
        windows:
          - [jan-1, dec-2, fair, medium]
        note: The most common red mango; ships well but is fibrous and mild.
      - variety: kent
        windows:
          - [nov-1, mar-2, fair, medium]
          - [jun-1, aug-2, prime, medium]
          - [sep-1, sep-2, fair, low]
      - variety: keitt
        windows:
          - [aug-1, oct-1, prime, medium]
      - variety: haden
        windows:
          - [mar-1, may-2, fair, medium]
    note: Spring Ataulfos and summer Kents are the best mangoes; winter imports are mostly fibrous Tommy Atkins.

  - item: pineapples
    traits:
      {
        shipsWell: [true, high],
        storesWell: [false, high],
        peakWorthSeeking: [false, medium],
        alwaysGood: [true, high],
      }
    origins:
      - origin: cr
        windows:
          - [jan-1, dec-2, fair, high]
    note: Costa Rican Gold pineapples are harvested ripe year-round; they don't sweeten after picking.

