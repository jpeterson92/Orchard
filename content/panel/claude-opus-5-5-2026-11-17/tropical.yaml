          - [jan-1, dec-2, fair, high]
      - origin: ec
        windows:
          - [jan-1, dec-2, fair, high]
      - origin: cr
        windows:
          - [jan-1, dec-2, fair, high]
      - origin: hn
        windows:
          - [jan-1, dec-2, fair, high]
