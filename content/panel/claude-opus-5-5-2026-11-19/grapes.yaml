category: grapes
items:
  - item: grapes
    traits:
      {
        shipsWell: [true, medium],
        storesWell: [false, medium],
        peakWorthSeeking: [true, medium],
        alwaysGood: [false, medium],
      }
    origins:
      - origin: us-ca
        windows:
          - [jun-1, jul-1, fair, medium]
          - [jul-2, oct-2, prime, high]
          - [nov-1, nov-2, fair, medium]
          - [dec-1, dec-2, poor, medium]
        note: Late-fall grapes come from storage and can loosen from the stem.
      - origin: mx
        windows:
          - [may-2, jul-1, fair, medium]
      - origin: cl
        windows:
          - [jan-1, mar-2, fair, medium]
          - [apr-1, may-1, poor, medium]
      - origin: pe
        windows:
          - [nov-2, feb-2, fair, medium]
    note: California late summer and fall is the sweet spot; Chilean winter grapes are good until late storage loosens them.
