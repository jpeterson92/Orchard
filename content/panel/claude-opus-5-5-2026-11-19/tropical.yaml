          - [jul-1, sep-2, prime, medium]
          - [oct-1, oct-2, fair, medium]
      - origin: mx
        windows:
          - [nov-1, apr-2, poor, medium]
      - origin: pe
        windows:
          - [jan-1, apr-1, poor, medium]
    note: Fresh figs are a California late-summer fruit; imports are picked firm and rarely luscious.
