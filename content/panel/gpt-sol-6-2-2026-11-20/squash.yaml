category: squash
items:
  - item: summer-squash
    traits:
      shipsWell: [true, medium]
      storesWell: [false, high]
      peakWorthSeeking: [true, high]
      alwaysGood: [false, high]
    origins:
      - origin: mx
        windows:
          - [oct-1, nov-1, fair, low]
          - [nov-2, mar-2, fair, medium]
          - [apr-1, may-1, poor, low]
      - origin: us-ca
        windows:
          - [apr-1, may-2, fair, low]
          - [jun-1, aug-2, prime, medium]
          - [sep-1, oct-2, fair, low]
      - origin: us-fl
        windows:
          - [nov-1, jan-2, fair, medium]
          - [feb-1, mar-2, fair, low]
          - [apr-1, may-2, prime, low]
      - origin: us-ga
        windows:
          - [may-1, jun-2, prime, low]
          - [sep-1, oct-2, fair, low]
    note:
      Young squash is tender and sweet near harvest, and softer skin and a watery interior make older squash
      less appealing.
  - item: winter-squash
    traits:
      shipsWell: [true, high]
      storesWell: [true, high]
      peakWorthSeeking: [true, high]
      alwaysGood: [false, high]
    origins:
      - origin: us
        windows:
          - [sep-1, sep-2, fair, medium]
          - [oct-1, dec-2, prime, high]
          - [jan-1, feb-2, fair, medium]
          - [mar-1, apr-2, poor, low]
      - origin: mx
        windows:
          - [nov-1, mar-2, fair, medium]
          - [apr-1, jun-2, fair, low]
    note: Fall harvests offer the best mix of sweet, dense squash, while late stored lots vary in texture and
      sweetness.
